name: Stock Screener screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: StockScreener
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Take screenshots on demo data
        run: |
          mkdir -p shots
          system_profiler SPDisplaysDataType | grep -i resolution || true
          ( .build/debug/StockScreener --demo-screenshots "$PWD/shots" & echo $! > pid ) 
          for i in $(seq 1 150); do
            sleep 2
            if [ -f shots/shots.tsv ]; then break; fi
          done
          kill $(cat pid) 2>/dev/null || true
          ls -la shots
          cat shots/shots.tsv || true
      - name: Publish screenshots to the "screenshots" branch
        run: |
          cd shots
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b screenshots
          git add -A
          git commit -q -m "Stock Screener screenshots (demo data), run ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
