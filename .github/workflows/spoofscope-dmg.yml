name: SpoofScope DMG

on:
  push:
    branches: [main]
    paths:
      - "SpoofScope/**"
      - ".github/workflows/spoofscope-dmg.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-dino:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: dino
          key: dinov2-small-560-${{ hashFiles('SpoofScope/scripts/export_dino.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
      - name: Export DINOv2-small to ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers onnx onnxruntime
          mkdir -p dino
          python SpoofScope/scripts/export_dino.py dino/dinov2_small_560.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: dinov2-onnx
          path: dino/dinov2_small_560.onnx

  build:
    needs: export-dino
    runs-on: macos-15-intel        # Intel (x86_64) build for a 2019 MacBook Pro
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SpoofScope
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dinov2-onnx
          path: SpoofScope/models

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
          python -c "import platform; print(platform.machine(), platform.mac_ver())"

      - name: Self-test (plain Python)
        env:
          SPOOFSCOPE_REQUIRE_DINO: "1"
        run: python launcher.py --selftest

      - name: Build app and DMG
        run: ./scripts/build-dmg.sh

      - name: Self-test (bundled app)
        env:
          SPOOFSCOPE_REQUIRE_DINO: "1"
        run: ./dist/SpoofScope.app/Contents/MacOS/SpoofScope --selftest

      - name: App page runs in a fresh process (bundled app)
        run: ./dist/SpoofScope.app/Contents/MacOS/SpoofScope --apptest

      - name: Server starts (bundled app)
        run: |
          SPOOFSCOPE_HEADLESS=1 ./dist/SpoofScope.app/Contents/MacOS/SpoofScope &
          PID=$!
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " server OK"; kill $PID || true; exit 0; fi
            sleep 2
          done
          echo "server did not start"; cat ~/SpoofScope/launcher.log || true; exit 1

      - name: Upload DMG (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SpoofScope-dmg
          path: SpoofScope/dist/SpoofScope.dmg

      - name: Publish Release with DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete spoofscope-latest --yes --cleanup-tag || true
          gh release create spoofscope-latest dist/SpoofScope.dmg \
            --title "SpoofScope (latest, build ${{ github.run_number }})" \
            --notes "Intel (x86_64) build, macOS 14+. Includes DINOv2-small (Apache-2.0). Drag SpoofScope to Applications. First launch: right-click > Open, or System Settings > Privacy & Security > Open Anyway. It opens in your web browser." \
            --latest=false
