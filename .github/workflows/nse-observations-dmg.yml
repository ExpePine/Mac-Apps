name: NSE Observations DMG

on:
  push:
    branches: [main]
    paths:
      - "NSEObservations/**"
      - ".github/workflows/nse-observations-dmg.yml"
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write      # needed to publish the Release with the DMG

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: NSEObservations
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app and DMG
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh

      - name: Upload DMG (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NSEObservations-dmg
          path: NSEObservations/dist/NSEObservations.dmg

      - name: Publish Release with DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nse-observations-build-${{ github.run_number }}"
          gh release create "$TAG" dist/NSEObservations.dmg \
            --title "NSE Observations (build ${{ github.run_number }})" \
            --notes "Download NSEObservations.dmg below, drag the app to Applications, then System Settings > Privacy & Security > Open Anyway on first launch. Universal (Apple Silicon + Intel), macOS 13 or later." \
            --latest=false

      - name: Update stable "nse-observations-latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nse-observations-latest --yes --cleanup-tag || true
          gh release create nse-observations-latest dist/NSEObservations.dmg \
            --title "NSE Observations (latest)" \
            --notes "Always the newest NSE Observations build (currently build ${{ github.run_number }}). Universal (Apple Silicon + Intel), macOS 13 or later." \
            --latest=false

      # Renders the main screens with SAMPLE data (no network, never touches a real journal)
      - name: Capture screenshots
        continue-on-error: true
        run: |
          BIN="build/Build/Products/Release/NSE Observations.app/Contents/MacOS/NSE Observations"
          "$BIN" --screenshots > shots.log 2>&1 &
          PID=$!
          for i in $(seq 1 120); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          grep -E "COMPRESS|SCREENSHOTS_DIR|SHOT " shots.log | while read -r l; do echo "::notice title=Capture::$l"; done || true
          SRC="$HOME/Library/Containers/com.raj.NSEObservations/Data/Library/Application Support/NSEObservations/screens"
          ls -la "$SRC" || true
          mkdir -p docs/screenshots
          cp "$SRC"/*.png docs/screenshots/
          grep COMPRESS shots.log | sed 's/^COMPRESS //; s/ | /\n/g' > docs/screenshots/compression.txt || true
          for f in docs/screenshots/*.png; do echo "::notice title=Screenshot::$(basename "$f") $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/{printf "%s ", $2}')"; done

      - name: Commit screenshots
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "NSE Observations: update screenshots (sample data) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
