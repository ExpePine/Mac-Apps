# XcodeGen spec — `xcodegen generate` creates ResumeForge.xcodeproj
# (the CI workflow does this; the .xcodeproj itself is not committed).
name: ResumeForge

options:
  bundleIdPrefix: com.rajmishra
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing — no Apple Developer account needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "13.0"

targets:
  ResumeForge:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleName: ResumeForge
        CFBundleDisplayName: ResumeForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Raj Mishra"
        CFBundleURLTypes:
          - CFBundleURLName: com.rajmishra.ResumeForge.import
            CFBundleURLSchemes: [resumeforge]
    entitlements:
      path: Support/ResumeForge.entitlements
      properties:
        # Not sandboxed: lets the app save PDFs anywhere and call the Groq API without extra entitlements.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajmishra.ResumeForge
        PRODUCT_NAME: ResumeForge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: ResumeForgeExtension
        embed: true

  ResumeForgeExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Shared
      # Copied flat into the extension's Resources (manifest.json must sit at the root).
      - path: Extension/Resources
        buildPhase: resources
    info:
      path: Support/Extension-Info.plist
      properties:
        CFBundleDisplayName: ResumeForge Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableDescription: "Send job descriptions from Naukri, Wellfound and LinkedIn to ResumeForge."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Support/Extension.entitlements
      properties:
        # App extensions must be sandboxed.
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajmishra.ResumeForge.Extension
        PRODUCT_NAME: ResumeForgeExtension
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  ResumeForge:
    build:
      targets:
        ResumeForge: all
        ResumeForgeExtension: all
    run:
      config: Debug
    archive:
      config: Release
