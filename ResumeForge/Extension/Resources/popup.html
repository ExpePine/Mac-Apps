<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; --accent: #2f5d8a; --muted: #777; --border: #8884; }
    body { font: 13px -apple-system, system-ui, sans-serif; width: 380px; margin: 0; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
    input, textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
    textarea { height: 150px; resize: vertical; font-size: 12px; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 8px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    .ok { color: #2e7d32; } .err { color: #c62828; }
    .meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>ResumeForge <span id="source" class="badge">…</span></h1>
  <div class="sub">Check the details, then send this job to the app.</div>

  <label for="title">Job title</label>
  <input id="title">
  <div class="row">
    <div><label for="company">Company</label><input id="company"></div>
    <div><label for="location">Location</label><input id="location"></div>
  </div>
  <label for="description">Job description</label>
  <textarea id="description" placeholder="Couldn't find the description automatically — paste it here."></textarea>
  <div id="meta" class="meta"></div>

  <div class="actions">
    <button id="copy">Copy as JSON</button>
    <button id="send" class="primary" disabled>Send to ResumeForge</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
