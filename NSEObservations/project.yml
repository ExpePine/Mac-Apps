# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: NSEObservations
options:
  bundleIdPrefix: com.raj
  deploymentTarget:
    macOS: "13.0"
targets:
  NSEObservations:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources                        # nse_equities.csv (NSE equity list) for symbol search
        buildPhase: resources
        optional: true
    scheme: {}                                 # shared scheme so xcodebuild -scheme works
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: NSE Observations
        CFBundleName: NSE Observations
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: Personal trading journal. Prices from Yahoo Finance (unofficial).
    entitlements:
      path: Sources/NSEObservations.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true               # Yahoo Finance + Groq
        com.apple.security.files.user-selected.read-write: true  # export / import backups
    settings:
      base:
        PRODUCT_NAME: NSE Observations
        PRODUCT_MODULE_NAME: NSEObservations
        PRODUCT_BUNDLE_IDENTIFIER: com.raj.NSEObservations
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"                # "Sign to Run Locally"; set your Team in Xcode if you have one
