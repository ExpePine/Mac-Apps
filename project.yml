# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: ActivityLogger
options:
  bundleIdPrefix: com.raj
  deploymentTarget:
    macOS: "13.0"
targets:
  ActivityLogger:
    type: application
    platform: macOS
    sources: [Sources]
    scheme: {}                                 # shared scheme so xcodebuild -scheme works
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Activity Logger
        LSUIElement: true                      # menu-bar only, no Dock icon
        NSMicrophoneUsageDescription: Activity Logger records short voice notes about what you worked on.
        NSSpeechRecognitionUsageDescription: Activity Logger converts your voice notes to text.
        NSAppleEventsUsageDescription: Activity Logger reads the website in your browser's front tab to measure how long you spend on each site. Only domain names are stored, on this Mac.
    entitlements:
      path: Sources/ActivityLogger.entitlements
      properties:
        com.apple.security.app-sandbox: false                # off: browser tab lookup needs Apple Events to any browser
        com.apple.security.device.audio-input: true          # microphone (hardened runtime)
        com.apple.security.automation.apple-events: true     # ask browsers for their front tab URL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raj.ActivityLogger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"                # "Sign to Run Locally"; set your Team in Xcode if you have one
